name: Syntax checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '5.6'
          - '8.2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

  javascript-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets -type f -name '*.js' -print0)
          node --check sw.js

  docker-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build Docker image
        run: docker build --tag sendzero-ci .

      - name: Container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name sendzero-ci -p 127.0.0.1:18080:80 sendzero-ci

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            docker logs sendzero-ci
            exit 1
          fi

          docker exec sendzero-ci php /var/www/html/cleanup.php

      - name: Remove smoke-test container
        if: always()
        run: docker rm -f sendzero-ci >/dev/null 2>&1 || true
