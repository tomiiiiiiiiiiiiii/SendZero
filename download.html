<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Receive with SendZero</title>
  <meta name="description" content="Encrypt in your browser. Share a link. The server never receives the decryption key.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="download">
  <main class="shell receiveShell">
    <header class="topbar">
      <a class="brand" href="./" data-i18n-aria="home_aria" aria-label="SendZero home">
        <span class="brandMark">0</span>
        <span>SendZero</span>
      </a>

      <div class="topActions">
        <span class="pill" data-i18n="pill_download">encrypted transfer</span>
        <div class="languageSwitcher" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="de">DE</button>
          <button type="button" data-lang="pl">PL</button>
        </div>
      </div>
    </header>

    <section class="card receiveCard">
      <p class="eyebrow" data-i18n="download_eyebrow">PRIVATE TRANSFER</p>
      <h1 id="title" data-i18n="opening_link">Opening secure link…</h1>
      <p class="lede small" id="description" data-i18n="checking_payload">Checking the encrypted payload.</p>

      <div class="filePanel hidden" id="filePanel">
        <div class="fileIcon">↓</div>
        <div>
          <strong id="fileName" data-i18n="encrypted_file">Encrypted file</strong>
          <span id="fileMeta"></span>
        </div>
      </div>

      <button class="primary hidden" id="downloadBtn" data-i18n="decrypt_save">Decrypt & save</button>

      <div class="progressWrap hidden" id="progressWrap">
        <div class="progress"><span id="progressBar"></span></div>
        <p id="status" data-i18n="downloading_data">Downloading encrypted data…</p>
      </div>

      <div class="notice hidden" id="notice"></div>
    </section>

    <footer>
      <span>2026 © <a href="https://sendzero.link/">SendZero.link</a></span>
      <span class="footerLinks">
        <span data-i18n="footer_private">Private file sharing</span>
        <span aria-hidden="true">·</span>
        <a href="terms.html" data-i18n="terms_link">Terms</a>
        <span aria-hidden="true">·</span>
        <a href="privacy.html" data-i18n="privacy_link">Privacy</a>
        <span aria-hidden="true">·</span>
        <a href="faq.html" data-i18n="faq_link">FAQ</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/tomiiiiiiiiiiiiii/SendZero" target="_blank" rel="noopener noreferrer" data-i18n="github_link">GitHub</a>
        <span aria-hidden="true">·</span>
        <a href="#" data-abuse-mail data-i18n="report_abuse">Report abuse</a>
      </span>
    </footer>
  </main>

  <script src="assets/i18n.js?v=20260926a"></script>
  <script src="assets/download.js"></script>
</body>
</html>
